name: Deploy Hexo Blog

# 推送 source 分支（源码）即自动构建并发布到 main 分支（GitHub Pages 读取分支）
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hexo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Deploy to main (Pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
