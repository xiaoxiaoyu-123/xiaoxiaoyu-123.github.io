# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: '小🐟博客'
subtitle: '这是一条潜水的🐟儿'
description: '小余的博客，欢迎访问'
keywords: 博客，小余，技术，前端，HTML，CSS ，JavaScript，Vue3
author: 小余
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://xiaoxiaoyu-123.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# 使用 wordcount 替代
wordcount:
  enable: true


# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:



# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

deploy:
  type: git
  repo: https://github.com/xiaoxiaoyu-123/xiaoxiaoyu-123.github.io.git
  branch: main


  # 字数统计配置
symbols_count_time:
  symbols: true           # 单篇文章字数统计
  time: true             # 单篇文章阅读时间
  total_symbols: true    # 站点总字数统计
  total_time: true       # 站点总阅读时间
  exclude_codeblock: false # 是否排除代码块



  # Hexo主配置文件 _config.yml
live2d:
  enable: true
  scriptFrom: local
  model:
    use: live2d-widget-model-koharu   # 使用本地安装的模型
    scale: 1
    # 可选：其他模型
    # use: live2d-widget-model-shizuku    白裙少女
    # use: live2d-widget-model-chitose    千岁
    # use: live2d-widget-model-miku       初音未来（虚拟歌姬）
    # use: live2d-widget-model-rem        雷姆
    # use: live2d-widget-model-unitychan  Unity酱 
    # use: live2d-widget-model-hijiki     黑猫
    # use: live2d-widget-model-tororo     白猫
    # use: live2d-widget-model-koharu     小春
    # use: live2d-widget-model-izumi      泉
  display:
    position: left
    width: 150
    height: 300
    hOffset: 25
    vOffset: -20
  mobile:
    show: true
    scale: 0.7
  react:
    opacityDefault: 0.8
    opacityOnHover: 0.9
  dialog:
    enable: true
    hitokoto: true
    script:
      click:
        default: ["初音未来登场！", "World is mine！", "我是虚拟歌姬~"]
      idle:
        default: ["喜欢Vocaloid吗？", "一起来听歌吧！🎶", "39！(Thank you!)"]